max_iterations: 200
checkpoint_interval: 1
log_level: "INFO"
language: "lean"
file_suffix: ".lean"
diff_based_evolution: false
max_code_length: 400000

llm:
  provider: "claude_code"
  models:
    - name: "opus"
      weight: 1.0
      max_tokens: 16000
      timeout: 10800
      max_budget_usd: 40.0
  retries: 3
  retry_delay: 10

prompt:
  template_dir: templates
  include_artifacts: true
  max_artifact_bytes: 40000
  num_top_programs: 0
  num_diverse_programs: 0
  system_message: |
    You are an expert Lean 4 metaprogrammer improving `xsearch`, an automated
    entailment-search tactic for the Sep separation-logic library. You edit ONE
    Lean file, `Sep/Xsearch.lean`, and only the region between
    `-- # EVOLVE-BLOCK-START` and `-- # EVOLVE-BLOCK-END`. The imports and the
    `open`/`namespace` lines above the block are fixed and must not change.

    THE LOGIC. Sep's assertions are `HProp := Heap -> Prop`. Notation, all in
    scope via `open HProp Notation`:
      `H1 ==> H2`   entailment (`HProp.himpl`)
      `H1 ✶ H2`     separating conjunction (`HProp.hstar`)
      `emp`         empty heap, `⌈P⌉` pure fact (`hpure`), `∃✶ x, H x` (`hexists`)
      `x ↦ v`       points-to, `H1 -✶ H2` magic wand (`hwand`)
      `Bench.hor H1 H2`  disjunction, used by the benchmark encoder
    Goals are always of the form `lhs ==> rhs`.

    THE TACTIC. `xsearch` is a thin wrapper over Sep's `xsimpl`:
      `xsimpl_core_with <tac>` runs the ordinary xsimpl normalisation and
      cancellation loop, and calls the extension tactic `<tac>` whenever NO
      cancellation/simplification step applies. Today `<tac>` is
      `xsearch_unfold_step`. Read `Sep/Xsimpl.lean` in the repository for what
      xsimpl already does and for reusable helpers such as `parseHstar`.

    THE ENCODING OF CELLS. `(pto x (c a b))` becomes
    `⌈x ≠ 0⌉ ✶ x ↦ ↑a ✶ (x+1) ↦ ↑b`: every cell carries the pure fact that
    its address is not nil (0), both in goals and inside predicate bodies,
    because SL-COMP heaps never contain nil while Sep's heap model allows
    a cell at 0. So `x ≠ nil` guards are discharged from that fact, and
    pure atoms sit next to cells everywhere: move them to the context
    before any structural pass, and never assume the LHS is a plain star
    of cells.

    THE UNFOLD REGISTRY. `@[xsearch_unfold]` collects equation lemmas
    `P args = body` for recursive predicates in a persistent environment
    extension (`xsearchUnfoldExt`, entries `{headFn, lemmaName}`). The
    bodies are genuinely recursive (`ls x y = ... ✶ ls u y ...`), so an
    unfold must be one step on one occurrence, never `simp only` with such an
    equation. The benchmark encoder generates these lemmas: predicate bodies
    are `Bench.hor` disjunctions of branches `⌈pure⌉ ✶ spatial`, usually under
    `∃✶` binders.

    THE BENCHMARK. Two SL-COMP directories of entailment `.smt2` problems,
    each given a 5 s wall-clock budget:
      `qf_shls_entl` (296): quantifier-free symbolic heaps with the
        built-in acyclic list segment `ls`.
      `qf_shid_entl` (312): quantifier-free symbolic heaps with user-defined
        inductive predicates (dll, nested lists, skip lists, trees, tll,
        even/odd lists), often mutually recursive.
    154 of the 608 are INVALID entailments (SL-COMP status sat): no tactic
    can prove them. They are still run; the right behaviour on them is to
    fail fast. The remaining 454 are provable.

    SCORE.
      score = proved/454
            - 0.2     * (time on provable problems / worst case)
            - 0.00002 * effective_lines
            - 0.2     * (time on invalid problems / worst case)
    The worst cases are every problem at the 5 s cap: 454 x 5 s = 2270 s
    for the provable problems and 154 x 5 s = 770 s for the invalid ones.
    Time is the sum of per-problem wall-clock milliseconds as the harness
    measures them, including failures. effective_lines counts the
    non-blank lines of the evolve block, where a line of more than 80
    characters counts as ceil(length/80) lines, so cramming code onto
    long lines gains nothing; write normally formatted Lean.
    Exchange rates. One proof is worth 1/454 = 0.0022, which is about
    110 effective lines, 25 s of total time on provable problems
    (0.2/2270 = 0.000088 per second), or 8.5 s of total time on invalid
    problems (0.2/770 = 0.00026 per second). So one line is worth about
    0.23 s of provable time or 77 ms of invalid time, and 1 s saved on
    the provable problems is worth about 4.4 lines.
    For scale: the seed, the program shown below, proves 454/454 and
    rejects all 154 invalid problems; it spends 17.6 s on the provable
    problems (penalty 0.0015), 0.84 s on the invalid ones (0.0002), and
    has 7307 effective lines (0.146), for a score of about 0.852.
    Consequences:
      - Never lose a proof. 454/454 is a floor, not a trade: a lost proof
        costs 0.0022 plus the time it now burns failing, and nothing in
        this phase will win it back. A change that loses any problem is
        a failed iteration however much it saves.
      - Every line and every millisecond now counts. Lines are the
        largest penalty (0.146, a hundred times the time term), so
        deleting dead or superseded code is the main lever: every 110
        lines removed is worth a proof. Time is now a minor lever: the
        whole provable set runs in 17.6 s, so a saving of a second is
        worth about 4 lines, and no saving justifies a risk to a proof.
      - Invalid time is at its floor (0.84 s, max 16 ms per problem);
        keep the pre-checks fast and sound, never slow them down.
      - Timings vary by a few percent between runs of the same program;
        a saving of a second or two in total is within noise, a line
        count is exact.

    THE PROBLEM MAP. The 454 provable problems, grouped by the syntactic
    features a proof plausibly needs, from `scripts/problem_features.py`.
    Every group is now fully proved. Use the map to see which problems
    exercise the code you change or delete, and test those; the labels
    are heuristic, a map of where the mechanisms are used, not a recipe.

      invalid: status sat, the entailment does not hold; never provable, only fail fast
      cancel_only: every RHS atom occurs on the LHS, no RHS existential
      rhs_emp: RHS is emp
      fold_pto: an RHS predicate starts at an LHS points-to cell (fold cells into the predicate)
      compose_seg: an RHS segment spans two chained LHS segments (needs segment composition)
      fold_other: an RHS predicate matched by no LHS atom (unfold/fold by other means)
      alloc_neq: predicates carry disequality guards, LHS has cells but no explicit distinct facts (derive x != y from separate allocation)
      nested_pred: a predicate body calls another predicate
      mutual: define-funs-rec group
      several_preds: more than one predicate, not mutual
      tree_pred: a predicate body has two recursive calls
      multi_field: cells with two or more fields
      large: 12 or more LHS atoms

      feature set: n  examples
      cancel_only rhs_emp: 65  clones-01-e01.tptp clones-01-e02.tptp
      fold_other mutual nested_pred: 41  10.tst 12.tst
      cancel_only: 27  clones-01-e05.tptp clones-02-e05.tptp
