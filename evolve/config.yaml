    FEEDBACK. Each program's evaluation artifacts contain: totals with the
    score decomposition and the name of that program's full result CSV in
    your working directory (with each problem's final stuck goal; other
    `bench-*.csv` files there belong to other programs); per-directory
    counts; `features`, the problem map above with proved/failed counts
    for this program and example unproved problems; the most common shapes
    of stuck goals; the slowest proved problems; and `outcomes`, one line
    per problem `name outcome ms` where t is a timeout and i an invalid
    problem. `.smt2` sources are under `sl-comp-bench/<dir>/`;
    `Bench/SlcompTests.lean` shows how to print a problem's Lean encoding
    and try the tactic on it.

    LEAN PITFALLS. `HProp.hstar`, `hpure`, `hexists`, `hsingle` are plain
    definitions over `Heap`, not inductives: `rcases`/`obtain` on a
    hypothesis `(H1 ✶ H2) h` fails. Use `HProp.hstar_elim`/`hstar_intro`
    from `Sep/HProp.lean`, or `simp only [HProp.hstar] at hh` first.
    `Bench.hor` lives in `Bench/Fixpoint.lean`, which imports Sep, so
    `Sep/Xsearch.lean` cannot mention it by name. It unfolds definitionally
    to `fun h => H1 h ∨ H2 h`; state disjunction lemmas over an arbitrary
    `f : HProp → HProp → HProp` with hypothesis
    `∀ H1 H2 h, f H1 H2 h ↔ (H1 h ∨ H2 h)`, and discharge it at the use site
    with `fun _ _ _ => Iff.rfl` after detecting the head symbol
    syntactically (e.g. any constant named `hor`). Match on `Option` values
    with `match ... with | some x => ... | none => ...`, not with
    `let some x := ... | ...` inside `Option`-returning pure code.

    WORKFLOW. Your working directory is a scratch checkout of the project.
    Edit only `Sep/Xsearch.lean` there. Whatever that file contains at the
    start is unrelated to your task and must not be read or reused: first
    overwrite it with the current program shown below, then make your
    change. Ground your work in tests:
      lake build Sep.Xsearch            # must succeed, read every error
      lake build bench
      lake exe bench --dir qf_shid_entl --filter <substring> --timeout 5000
    Test on the problems your change touches (the slowest ones for a
    time change, the groups that use the code you delete) and on a few
    others, so you neither lose a proof nor hang. Do not run a whole
    directory; the evaluator does that. Iterate until the file
    compiles and the problems you touched are still proved. You have two
    hours of wall-clock time in total and no clock, so budget by count: after about 25 tool calls
    of implementation and 10 of testing, stop and reply. If the run is
    cut short your reply is lost and the iteration is wasted, so reply
    with a compiling improvement well before the limit rather than
    perfecting it: a smaller verified change beats a larger unverified one.

    STATUS: THE SEED. The program below is the end of a manual climb that
    took `xsearch` from 289 to all 454 provable problems in 22 steps
    without ever losing one, followed by a time climb (steps T2 to T6)
    that cut the provable time from 187 s to 17.6 s, again losing none.
    The time climb replaced the generic simp-based xsimpl with a native
    normaliser on atom lists (in `Sep/SepLogic.lean`, outside the evolve
    block, keep its interface), made every budget a deterministic
    virtual clock (`vclock`, from heartbeats, so runs are reproducible),
    emits the benchmark definitions as direct terms, and compiles the
    countermodel check to a small IR. The proof-search mechanisms were
    built by adding, never by removing, so the block still carries the
    code of every stage. Its architecture, in the order the `xsearch`
    macro runs it (the millisecond budgets named below are virtual
    milliseconds, roughly wall milliseconds on the reference machine):
      1. Pre-checks that can only fail, never prove. `xsearch_refute`
         fails on an RHS variable the LHS does not mention.
         `xsearch_cmodel` (`cmFind` and the `cm*` helpers at the end of
         the block) searches for a concrete countermodel: it builds LHS
         heaps by bounded unfolding under several unfolding policies,
         merges forced equalities with a union-find, tries aliasing
         rounds with nil and LHS existentials, and evaluates the RHS
         exactly on the finite heap; anything unsupported counts as
         incomplete and never rejects; 150 ms cap per problem.
      2. `xsearch_start` sets the global deadline (6000 virtual ms from the start
         of the search) and clears the per-problem caches (`indCache`,
         `segLemCache`, `permCache`, `invCache`, the snoc/parity/conv
         caches and about ten more) and budget counters.
      3. A fast path: plain `xsimpl_core_with xsearch_unfold_step` plus
         `xsearch_pure`, which closes the cancellation-only problems.
      4. Otherwise pure preparation: `xsearch_eqsubst`, `xsearch_trivpure`,
         `xsearch_macros` (unfold non-recursive definitions),
         `xsearch_exwit` (RHS existentials pinned by equalities), and the
         facts derivation: `xsearch_pfacts` (`x ≠ 0` from guarded
         cells), `xsearch_facts` (pairwise disequalities of allocated
         locations via direct proof terms, `addNeFast`, `hasLocPf?`,
         `nePf?`), `xsearch_bkfacts` (`proveBkAlloc`: a far parameter is
         allocated in the segment or the segment is at its base),
         `xsearch_dblalloc` (refute double allocation).
      5. `xsearch_backtrack`: the composition pre-pass `composePass`
         (strict first, then again after `xsearch_snefacts` and
         `xsearch_qfacts` when a witness was missing, then non-strict).
         It reads each predicate's shape from its unfold equation as a
         `SegDesc` (near/far/fixed parameters, cell group, payload
         atoms, cell or emp base), plans chains over the LHS successor
         graph (`planChain`), orders compositions by a witness-precedence
         graph, finds endpoint witnesses (`findWitness`, `findSafe` with
         `safeFar`), and rewrites with per-predicate lemmas proved on
         demand (`proveSegLemsG`, `proveCompSpec`, `composeSafe`,
         `composePairG`/`combine2` for two chains at once). Then
         `splitSolve` (nil case splits on stuck witnesses), then
         `searchSolve 40`, then `snocTop` as a last resort.
      6. `searchSolve`/`branchGoal` (one `mutual` block): an xsimpl
         normalisation round (contradiction, disjunction distribution
         and split, existential witnesses, xsimpl, subst), then for each
         stuck goal an ordered list of alternatives tried with
         backtracking: RHS disjunction branches ranked by
         `branchScoreD`; early LHS unfolds (`earlyLhsOccs`); then
         `forallAlts`, `parityAlts`, `hwithAlts`, `specAlts`, `invAlts`;
         then forced unfolds of allocated occurrences (depth 6, half the
         remaining time per slice), wand alternatives (`wandAlt`,
         `wandAltS`, `wandAltK`), `implAllAlt`, `composeAlt`, `segAlt`/
         `segAltU`, `implAlt`; then the late ones (`convKAlt`, projected
         `implAlt`, non-recursive rewrites, `snocKAlt`); finally plain
         RHS and LHS unfolds.
      7. Lemma provers, all by `lfpG_induct` with an invariant, called
         from the alternatives and cached per problem: `proveInduct`
         (predicate-to-predicate induction with argument projection,
         modes 0 to 3, `lfp` invariants per mutual group), `proveConvK`,
         `proveSnocG`/`proveSnocNil`/`proveSnocK`, `proveParity`,
         `proveInv` (invariants derived from the definitions by
         `deriveA`/`deriveB`, strong induction via `hwith`),
         `proveFarImp`, `proveAllocNe`, `proveSrcNe`, `proveSelfAlloc`.
         Budgets (virtual ms, read the constants in the code before
         relying on a figure): induction leash 2100 for recursive
         predicates and 1100 otherwise, segment-lemma budget 2000,
         cumulative induction and compose caps, `searchNodes` 20000,
         compose fuel 16 to 64 tries; everything stops at the 6000 ms
         global deadline. On the seed no proof uses more than a small
         fraction of any budget.
    The `mutual` block containing `searchSolve` and `branchGoal` is near
    Lean's 200k heartbeat limit for one declaration: do not add code
    there; add helpers outside it, and removing code from it is safe.
    Earlier versions of the program exist only in git history.

    NEXT STEP: THE NEW OBJECTIVE. Keep 454/454 and every invalid
    rejection, and make the program faster and shorter.
      - Lines. The later mechanisms subsume much of the earlier code:
        look for alternatives that no longer fire first on any problem,
        near-duplicate helpers (`peelEx`/`peelExG`/`peelExM`/`exPeel`,
        `mkStarOf`/`mkStarM`, `provePerm`/`provePermFast`/
        `provePermCore`, the three snoc provers, the per-mode branches
        of `proveInduct`),
        code paths from the R1 to R4 era that the composition pre-pass,
        derived invariants or `implAllAlt` now cover, and unused
        theorems. Before deleting a mechanism, find which problems use
        it (instrument it on a filter, or remove it and run the groups
        in the problem map that could need it); a mechanism that proves
        nothing on its own is dead weight.
      - Time. 17.6 s total on the provable problems (qf_shls_entl
        6.5 s, qf_shid_entl 11.1 s), no problem over 0.4 s, median about
        25 ms; the remaining cost is spread thin (countermodel check
        about 2.3 s, kernel checking 1.7 s, xsimpl 2.1 s, composition
        0.9 s). The 20 slowest valid problems in the seed, ms:
           395 bolognesa-17-e10.tptp    334 bolognesa-19-e05.tptp
           293 bolognesa-13-e01.tptp    238 bolognesa-15-e02.tptp
           217 bolognesa-16-e05.tptp    202 skl3-vc04
           192 skl3-vc07                167 dll2-spaghetti
           162 bolognesa-15-e04.tptp    152 tll_slk-13
           147 skl3-vc05                142 bolognesa-17-e06.tptp
           137 skl3-vc08                132 lsegex4_slk-4
           127 elseg4_slk-7             127 tll-ravioli
           127 bolognesa-14-e08.tptp    126 dll_append_tail_entails_dllnull.sb
           126 bolognesa-20-e07.tptp    122 skl2-vc03
        Every proof has a wide margin to the 5 s cap and to its internal
        budgets, so a change that slows a problem by a few hundred
        milliseconds loses nothing; a change that loses a proof loses
        far more than any time saving can recover.
      - One change per iteration, measured: state the lines removed and
        the time saved on the problems you ran, and check that the
        problems which exercise what you touched are still proved.

    NO COPYING. Other programs in the population are not shown. Your
    result must be a distinct program that improves on the current
    program shown below through a change of your own.

    OUTPUT. When done, reply with SEARCH/REPLACE diff blocks that transform
    the current program shown below into your final `Sep/Xsearch.lean`, in
    the exact format requested. Only the diff blocks in your reply count;
    edits left in the scratch checkout are discarded, and a reply without a
    valid diff block is discarded. Before replying, check every SEARCH
    block against the current program shown below, not against your
    scratch file: a SEARCH block that does not match verbatim, or diffs
    that together leave a function's type inconsistent, produce a build
    failure and the iteration scores 0.

    HARD RULES.
      - No `sorry`, `admit`, `axiom`, `native_decide`, `unsafe`,
        `implemented_by`, `ofReduceBool`, `extern`. A program containing any of
        these scores 0. Every proof must be genuine.
      - Only edit inside the evolve block; do not touch imports.
      - The file must compile under Lean 4.29 with this project's mathlib. A
        build failure scores 0; the compiler error is fed back to you as an
        artifact, so read it.
      - Keep the `xsearch` tactic syntax, the `xsearch_unfold` attribute and
        `xsearchUnfoldExt` working: the benchmark encoder tags its generated
        unfold equations with `@[xsearch_unfold]` and calls `by xsearch`.
      - Write clean Lean: no comments, no docstrings.
      - Every tactic must be total and terminate; guard every search loop with
        an explicit fuel/depth bound, since a hang is scored as a timeout (0).

database:
  population_size: 60
  random_seed: null
  archive_size: 5
  exploration_ratio: 0.25
  exploitation_ratio: 0.75
  num_islands: 1
  feature_dimensions:
    - "time_score"
    - "lines"
  feature_bins: 8

evaluator:
  timeout: 4000
  cascade_evaluation: false
  parallel_evaluations: 1
